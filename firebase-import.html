<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KNR Firebase Data Import</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Sarabun,sans-serif;background:#f2f4f7;color:#1b2a41;margin:0;padding:24px}
.card{max-width:720px;margin:auto;background:white;border:1px solid #e3e8ef;border-radius:14px;padding:22px}
h1{margin:0 0 4px;font-size:24px}.muted{color:#5b6b7f;font-size:13px;line-height:1.5}
button{font:inherit;border:0;border-radius:9px;padding:10px 15px;font-weight:600;cursor:pointer}
.primary{background:#0e7c66;color:#fff}.ghost{background:#eef2f6;color:#1b2a41}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.status{background:#f7f9fb;border:1px solid #e3e8ef;border-radius:10px;padding:12px;margin-top:12px;white-space:pre-wrap}
.ok{background:#e2f4ef}.bad{background:#fdeaea}.warn{background:#fdf0e5}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
td,th{border-bottom:1px solid #eef2f6;padding:7px;text-align:left}td:last-child{text-align:right}
input[type=file]{width:100%;padding:10px;border:1px solid #e3e8ef;border-radius:8px}
progress{width:100%;height:16px;margin-top:12px}
code{font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<div class="card">
<h1>KNR Firebase Migration</h1>
<div class="muted">หน้าเครื่องมือนี้ไม่มีข้อมูลผู้พักฝังอยู่ในไฟล์ คุณต้องเลือก knr-migration-data.json จากเครื่องของคุณเอง</div>

<div id="authStatus" class="status">กำลังตรวจสอบ Google Login…</div>
<div class="row">
  <button id="loginBtn" class="primary" style="display:none">Sign in with Google</button>
  <button id="logoutBtn" class="ghost" style="display:none">Sign out</button>
</div>

<hr style="border:0;border-top:1px solid #e3e8ef;margin:18px 0">
<label><b>1) เลือก migration JSON</b></label>
<input id="fileInput" type="file" accept=".json,application/json" disabled>
<div id="preview"></div>

<div class="row">
  <button id="importBtn" class="primary" disabled>2) Import เข้า Firestore</button>
</div>
<progress id="prog" value="0" max="1" style="display:none"></progress>
<div id="importStatus" class="status" style="display:none"></div>

<div class="muted" style="margin-top:16px">
เครื่องมือนี้ใช้ <code>setDoc(..., {merge:true})</code> และไม่ลบ authorizedUsers หรือข้อมูล collection อื่น
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc }
  from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTuViKJdv0kF794q7URsXSMwV3TOYnruM",
  authDomain: "knr-apartment.firebaseapp.com",
  projectId: "knr-apartment",
  storageBucket: "knr-apartment.firebasestorage.app",
  messagingSenderId: "359932428062",
  appId: "1:359932428062:web:2ea0ed0a5189a95ebed30f",
  measurementId: "G-C582JF7GTL"
};

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id);
let authorized=false, payload=null;

function authMsg(msg,cls=""){ $("authStatus").className="status "+cls; $("authStatus").innerHTML=msg; }
function importMsg(msg,cls=""){ $("importStatus").style.display="block"; $("importStatus").className="status "+cls; $("importStatus").textContent=msg; }

$("loginBtn").onclick=()=>signInWithPopup(auth,provider).catch(e=>authMsg(e.code+" "+e.message,"bad"));
$("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth, async user=>{
  authorized=false; payload=null; $("preview").innerHTML=""; $("fileInput").value="";
  $("fileInput").disabled=true; $("importBtn").disabled=true;
  if(!user){
    authMsg("<b>ยังไม่ได้ Login</b>","warn");
    $("loginBtn").style.display="inline-block"; $("logoutBtn").style.display="none"; return;
  }
  $("loginBtn").style.display="none"; $("logoutBtn").style.display="inline-block";
  authMsg("กำลังตรวจสิทธิ์ "+user.email+" …");
  try{
    const s=await getDoc(doc(db,"authorizedUsers",user.email));
    if(!s.exists() || s.data().active!==true){
      authMsg("<b>Access denied</b><br>"+user.email,"bad"); return;
    }
    if(s.data().role!=="admin"){
      authMsg("<b>ต้องเป็น admin จึง import ได้</b><br>Role ปัจจุบัน: "+(s.data().role||"-"),"bad"); return;
    }
    authorized=true; $("fileInput").disabled=false;
    authMsg("<b>✓ Authorized admin</b><br>"+user.email,"ok");
  }catch(e){authMsg(e.code+" "+e.message,"bad")}
});

$("fileInput").onchange=async e=>{
  payload=null; $("importBtn").disabled=true; $("preview").innerHTML="";
  const f=e.target.files[0]; if(!f||!authorized)return;
  try{
    const p=JSON.parse(await f.text());
    const required=["config","rooms","tenants","meterReadings","bills","acLogs"];
    if(!required.every(k=>p[k] && typeof p[k]==="object")) throw new Error("JSON schema ไม่ครบ");
    payload=p;
    const counts={
      "rooms":Object.keys(p.rooms).length,
      "tenants":Object.keys(p.tenants).length,
      "meterReadings":Object.keys(p.meterReadings).length,
      "bills":Object.keys(p.bills).length,
      "acLogs":Object.keys(p.acLogs).length,
      "config":Object.keys(p.config).length
    };
    $("preview").innerHTML="<table><tr><th>Collection</th><th>Documents</th></tr>"+
      Object.entries(counts).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")+
      "</table><div class='status warn'><b>ตรวจสอบก่อนกด Import</b>\n"+
      "Duplicate bill rows removed: "+(p.meta?.duplicateBillRowsRemoved??0)+"</div>";
    $("importBtn").disabled=false;
  }catch(err){ $("preview").innerHTML="<div class='status bad'>อ่าน JSON ไม่ได้: "+err.message+"</div>"; }
};

$("importBtn").onclick=async()=>{
  if(!authorized||!payload)return;
  if(!confirm("Import ข้อมูล KNR เข้า Firestore ตอนนี้?"))return;
  $("importBtn").disabled=true; $("fileInput").disabled=true;
  const ops=[];
  for(const [id,data] of Object.entries(payload.config)) ops.push(["config",id,data]);
  for(const [id,data] of Object.entries(payload.rooms)) ops.push(["rooms",id,data]);
  for(const [id,data] of Object.entries(payload.tenants)) ops.push(["tenants",id,data]);
  for(const [id,data] of Object.entries(payload.meterReadings)) ops.push(["meterReadings",id,data]);
  for(const [id,data] of Object.entries(payload.bills)) ops.push(["bills",id,data]);
  for(const [id,data] of Object.entries(payload.acLogs)) ops.push(["acLogs",id,data]);

  $("prog").style.display="block"; $("prog").max=ops.length; $("prog").value=0;
  let done=0;
  try{
    for(const [col,id,data] of ops){
      await setDoc(doc(db,col,id),data,{merge:true});
      done++; $("prog").value=done;
      if(done%10===0 || done===ops.length) importMsg(`กำลัง Import ${done} / ${ops.length} documents…`);
    }
    importMsg(`✓ Import สำเร็จ ${done} documents\n\nไปดู Firestore > Data เพื่อตรวจสอบได้เลย`,"ok");
  }catch(err){
    console.error(err);
    importMsg(`Import หยุดที่ ${done} / ${ops.length}\n${err.code||""}\n${err.message}`,"bad");
  }finally{
    $("importBtn").disabled=false; $("fileInput").disabled=false;
  }
};
</script>
</body>
</html>
