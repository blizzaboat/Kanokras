<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กนกรัศม์ — Firebase Login Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#1b2a41; --teal:#0e7c66; --teal-dark:#0a5f4e;
      --bg:#f2f4f7; --paper:#fff; --line:#e3e8ef; --muted:#5b6b7f;
      --red:#b3261e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    }
    .card{
      width:min(520px,100%);background:var(--paper);border:1px solid var(--line);
      border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(27,42,65,.10);
    }
    .logo{font-size:30px;font-weight:700;text-align:center}
    .sub{text-align:center;color:var(--muted);font-size:13px;letter-spacing:2px;margin-top:2px}
    .status{
      margin:22px 0 16px;padding:14px;border-radius:10px;background:#f7f9fb;
      border:1px solid var(--line);font-size:14px;line-height:1.55;
    }
    .status.ok{background:#e2f4ef;border-color:#b7e3d7}
    .status.bad{background:#fdeaea;border-color:#f3c5c1}
    button{
      width:100%;border:0;border-radius:10px;padding:12px 16px;
      font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;
    }
    .primary{background:var(--teal);color:white}
    .primary:hover{background:var(--teal-dark)}
    .ghost{background:#eef2f6;color:var(--ink)}
    .hidden{display:none}
    .small{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.55}
    code{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">กนกรัศม์</div>
    <div class="sub">FIREBASE LOGIN TEST</div>

    <div id="status" class="status">กำลังตรวจสอบสถานะการเข้าสู่ระบบ…</div>

    <button id="loginBtn" class="primary hidden">Sign in with Google</button>
    <button id="logoutBtn" class="ghost hidden">Sign out</button>

    <div class="small">
      หน้านี้ใช้ทดสอบเฉพาะ Google Authentication + Firestore allow-list เท่านั้น
      ยังไม่เชื่อมข้อมูลหอพักจริง และไม่แก้ระบบเดิม
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTuViKJdv0kF794q7URsXSMwV3TOYnruM",
      authDomain: "knr-apartment.firebaseapp.com",
      projectId: "knr-apartment",
      storageBucket: "knr-apartment.firebasestorage.app",
      messagingSenderId: "359932428062",
      appId: "1:359932428062:web:2ea0ed0a5189a95ebed30f",
      measurementId: "G-C582JF7GTL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const statusBox = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    function showStatus(message, kind="") {
      statusBox.className = "status" + (kind ? " " + kind : "");
      statusBox.innerHTML = message;
    }

    loginBtn.addEventListener("click", async () => {
      loginBtn.disabled = true;
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error(err);
        showStatus(
          "<b>Login ไม่สำเร็จ</b><br>" +
          (err.code || "") + " " + (err.message || err),
          "bad"
        );
      } finally {
        loginBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        showStatus(
          "<b>ยังไม่ได้เข้าสู่ระบบ</b><br>กดปุ่มด้านล่างเพื่อทดสอบ Google Login"
        );
        loginBtn.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
        return;
      }

      loginBtn.classList.add("hidden");
      logoutBtn.classList.remove("hidden");
      showStatus("กำลังตรวจสอบสิทธิ์ของ <b>" + user.email + "</b> …");

      try {
        const ref = doc(db, "authorizedUsers", user.email);
        const snap = await getDoc(ref);

        if (!snap.exists() || snap.data().active !== true) {
          showStatus(
            "<b>Access denied</b><br>" +
            "Google Login สำเร็จ แต่บัญชี <code>" + user.email +
            "</code> ไม่ได้อยู่ใน authorizedUsers หรือ active ไม่ใช่ true",
            "bad"
          );
          return;
        }

        const data = snap.data();
        showStatus(
          "<b>✓ Firebase Login + Authorization สำเร็จ</b><br>" +
          "ชื่อ: " + (data.name || "-") + "<br>" +
          "Email: <code>" + user.email + "</code><br>" +
          "Role: <b>" + (data.role || "-") + "</b>",
          "ok"
        );
      } catch (err) {
        console.error(err);
        showStatus(
          "<b>อ่าน Firestore ไม่สำเร็จ</b><br>" +
          "<code>" + (err.code || "") + "</code><br>" +
          (err.message || err),
          "bad"
        );
      }
    });
  </script>
</body>
</html>
